[project]
name = "gpu-dev-assist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "aish.vadlamudi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "pymupdf>=2.1",
    "pypdf>=7.1.0",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
gpu-dev-assist = "gpu_dev_assist:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
