[project]
name = "gpu-dev-assist"
version = "0.1.0"
description = "GPU Development Assistant"
readme = "README.md"
authors = [
    { email = "aish.vadlamudi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.10.0",
    "chromadb>=1.5.9",
    "fastapi>=0.165.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "pymupdf>=2.1",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "snowballstemmer>=3.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
gpu-dev-assist = "gpu_dev_assist.cli:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
